<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4b400">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<title>پشتیبانی زعفران شیرزاد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #f4b400;
    --deep: #d48806;
    --bg: #1a1410;
    --panel: #241d16;
    --card: #2d2419;
    --text: #f5e6d3;
    --muted: #b8a790;
    --border: rgba(244, 180, 0, 0.25);
    --green: #22c55e;
    --red: #c0392b;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 20%, rgba(244,180,0,0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(192,57,43,0.06) 0%, transparent 40%);
    display: flex; justify-content: center; align-items: center;
    color: var(--text); padding: 16px;
  }
  .app {
    width: 100%; max-width: 500px; height: 100%;
    max-height: 780px;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
    position: relative;
  }

  /* HEADER */
  .header {
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(36,29,22,0.98), rgba(26,20,16,0.9));
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--deep));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(244,180,0,0.35);
    position: relative;
  }
  .avatar::after {
    content: ''; position: absolute; bottom: -2px; left: -2px;
    width: 12px; height: 12px; background: var(--green);
    border-radius: 50%; border: 3px solid var(--panel);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
    50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  }
  .header-info h1 { font-size: 14px; font-weight: 700; }
  .header-info p { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .header-info p span { color: var(--green); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(244,180,0,0.08); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: all 0.2s;
  }
  .icon-btn:hover { background: rgba(244,180,0,0.18); color: var(--gold); }

  /* CHAT */
  .chat {
    flex: 1; padding: 18px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(244,180,0,0.2); border-radius: 10px; }
  .msg-row { display: flex; gap: 8px; max-width: 100%; animation: slide 0.3s ease; }
  .msg-row.user { flex-direction: row-reverse; }
  @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg-av {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-top: 2px;
  }
  .msg-av.bot { background: linear-gradient(135deg, var(--gold), var(--deep)); }
  .msg-av.user { background: linear-gradient(135deg, var(--red), #8b2a1f); }
  .msg {
    max-width: 78%; padding: 10px 14px;
    border-radius: 14px; font-size: 13px;
    line-height: 1.75; word-wrap: break-word;
  }
  .msg.bot {
    background: var(--card); border: 1px solid var(--border);
    border-top-right-radius: 4px;
  }
  .msg.user {
    background: linear-gradient(135deg, var(--gold), var(--deep));
    color: #1a1410; font-weight: 500;
    border-top-left-radius: 4px;
  }
  .msg strong { color: var(--gold); }
  .msg.user strong { color: #1a1410; }
  .msg time { display: block; font-size: 9.5px; opacity: 0.5; margin-top: 4px; text-align: left; }

  /* TYPING */
  .typing { display: flex; gap: 8px; animation: slide 0.3s; }
  .typing-bubble {
    background: var(--card); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: 14px;
    border-top-right-radius: 4px;
    display: flex; gap: 4px; align-items: center;
  }
  .typing-bubble span {
    width: 6px; height: 6px; background: var(--gold);
    border-radius: 50%; animation: bounce 1.4s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* QUICK REPLIES */
  .quick {
    padding: 0 18px 10px;
    display: flex; gap: 6px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .quick button {
    padding: 7px 12px; font-size: 11.5px;
    background: rgba(244,180,0,0.08); border: 1px solid var(--border);
    border-radius: 18px; color: var(--gold);
    cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .quick button:hover { background: rgba(244,180,0,0.2); transform: translateY(-1px); }

  /* FOOTER */
  .footer {
    padding: 12px 18px calc(14px + var(--safe-bottom));
    background: linear-gradient(0deg, rgba(36,29,22,0.98), rgba(26,20,16,0.7));
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .footer input {
    flex: 1; padding: 12px 16px;
    background: rgba(26,20,16,0.8);
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 13px;
    font-family: inherit; outline: none;
    transition: border 0.2s;
  }
  .footer input:focus { border-color: var(--gold); }
  .footer input::placeholder { color: var(--muted); }
  .send {
    width: 46px; height: 46px; border: none;
    border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--gold), var(--deep));
    color: #1a1410; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(244,180,0,0.4); }
  .send:active { transform: scale(0.96); }

  /* SUPPORT FORM */
  .support-form {
    background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(34,197,94,0.02));
    border: 1px solid rgba(34,197,94,0.4);
    border-radius: 14px; padding: 14px; margin-top: 8px;
  }
  .support-form h4 {
    font-size: 13px; color: var(--green);
    margin-bottom: 10px; font-weight: 700;
  }
  .support-form input,
  .support-form textarea {
    width: 100%; padding: 10px 12px;
    background: rgba(26,20,16,0.8);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 12.5px;
    font-family: inherit; outline: none;
    margin-bottom: 8px;
    transition: border 0.2s;
  }
  .support-form input:focus,
  .support-form textarea:focus { border-color: var(--green); }
  .support-form textarea { min-height: 60px; resize: vertical; }
  .support-form button {
    width: 100%; padding: 11px;
    background: linear-gradient(135deg, var(--green), #16a34a);
    color: white; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700;
    font-family: inherit; cursor: pointer;
    transition: all 0.2s;
  }
  .support-form button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(34,197,94,0.4); }
  .support-form button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ADMIN */
  .admin {
    position: absolute; inset: 0;
    background: var(--panel);
    z-index: 100;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .admin.open { transform: translateY(0); }
  .admin-head {
    padding: 16px 20px;
    background: linear-gradient(180deg, rgba(36,29,22,0.98), rgba(26,20,16,0.7));
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .admin-head h2 { font-size: 15px; color: var(--gold); font-weight: 700; }
  .close-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(192,57,43,0.15);
    border: 1px solid rgba(192,57,43,0.4);
    color: #ff8a80; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .tabs {
    display: flex; gap: 4px; padding: 10px 16px 0;
    background: rgba(26,20,16,0.6);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; flex-shrink: 0;
  }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab {
    padding: 10px 16px; background: transparent;
    border: none; color: var(--muted);
    font-size: 12.5px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    border-radius: 10px 10px 0 0;
    border-bottom: 2px solid transparent;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab.active {
    color: var(--gold); border-bottom-color: var(--gold);
    background: rgba(244,180,0,0.08);
  }
  .admin-body { flex: 1; overflow-y: auto; padding: 18px; }
  .admin-body::-webkit-scrollbar { width: 6px; }
  .admin-body::-webkit-scrollbar-thumb { background: rgba(244,180,0,0.2); border-radius: 10px; }
  .pane { display: none; }
  .pane.active { display: block; }

  .section {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section h3 { font-size: 13.5px; color: var(--gold); font-weight: 700; }
  .btn {
    padding: 9px 16px; border-radius: 10px;
    font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    border: none; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--deep)); color: #1a1410; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(244,180,0,0.35); }
  .btn-ghost { background: rgba(244,180,0,0.08); color: var(--gold); border: 1px solid var(--border); }
  .btn-danger { background: rgba(192,57,43,0.15); color: #ff8a80; border: 1px solid rgba(192,57,43,0.4); }
  .btn-sm { padding: 6px 10px; font-size: 11.5px; }

  .item {
    background: rgba(26,20,16,0.6);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px;
  }
  .item-head {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 10px;
    margin-bottom: 6px;
  }
  .keywords { display: flex; flex-wrap: wrap; gap: 4px; }
  .kw {
    background: rgba(244,180,0,0.12);
    color: var(--gold); font-size: 10.5px;
    padding: 3px 8px; border-radius: 6px;
    border: 1px solid rgba(244,180,0,0.25);
  }
  .answer {
    font-size: 12px; color: var(--muted);
    line-height: 1.6; max-height: 50px;
    overflow: hidden;
  }
  .item-actions { display: flex; gap: 5px; flex-shrink: 0; }

  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--muted); font-size: 13px;
  }
  .empty .em { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.4; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .stat {
    background: linear-gradient(135deg, rgba(244,180,0,0.08), rgba(244,180,0,0.02));
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--gold); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 5px; font-weight: 500;
  }
  .form-group input,
  .form-group textarea {
    width: 100%; padding: 11px 14px;
    background: rgba(26,20,16,0.8);
    border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 12.5px; font-family: inherit;
    outline: none; transition: border 0.2s;
  }
  .form-group input:focus,
  .form-group textarea:focus { border-color: var(--gold); }
  .form-group textarea { min-height: 80px; resize: vertical; line-height: 1.6; }

  /* LOGIN */
  .login {
    position: absolute; inset: 0;
    background: var(--panel); z-index: 110;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login.open { display: flex; }
  .login-card {
    background: linear-gradient(180deg, var(--panel), var(--bg));
    border: 1px solid var(--border);
    border-radius: 20px; padding: 30px 26px;
    width: 100%; max-width: 340px;
    text-align: center;
  }
  .login-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg, var(--gold), var(--deep));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin: 0 auto 14px;
  }
  .login-card h3 { font-size: 16px; color: var(--gold); margin-bottom: 6px; }
  .login-card p { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .login-card input {
    width: 100%; padding: 12px 16px;
    background: rgba(26,20,16,0.9);
    border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-size: 13px; font-family: inherit;
    outline: none; text-align: center;
    letter-spacing: 2px; margin-bottom: 12px;
  }
  .login-card input:focus { border-color: var(--gold); }
  .login-card button {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, var(--gold), var(--deep));
    color: #1a1410; border: none;
    border-radius: 12px; font-size: 13.5px;
    font-weight: 700; font-family: inherit;
    cursor: pointer; transition: all 0.2s;
  }
  .login-card button:hover { transform: translateY(-2px); }
  .login-err {
    color: #ff8a80; font-size: 12px;
    margin-top: 10px; min-height: 16px;
  }
  .login-cancel {
    margin-top: 12px; background: transparent;
    border: none; color: var(--muted);
    font-size: 12px; cursor: pointer;
    font-family: inherit;
  }

  /* MODAL */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 460px;
    max-height: 88vh;
    background: linear-gradient(180deg, var(--panel), var(--bg));
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: pop 0.3s ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h3 { font-size: 14px; color: var(--gold); font-weight: 700; }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
  .modal-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, var(--gold), var(--deep));
    color: #1a1410; padding: 11px 20px;
    border-radius: 12px; font-size: 12.5px;
    font-weight: 600; z-index: 300;
    opacity: 0; transition: all 0.4s;
    pointer-events: none; max-width: 90%;
    text-align: center;
    box-shadow: 0 12px 30px rgba(244,180,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* MOBILE */
  @media (max-width: 520px) {
    body { padding: 0; }
    .app { max-width: 100%; height: 100vh; height: 100dvh; border-radius: 0; }
    .msg { max-width: 82%; }
  }
</style>
</head>
<body>
  <div class="app">
    
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="avatar">🌸</div>
        <div class="header-info">
          <h1>پشتیبانی زعفران شیرزاد</h1>
          <p><span>●</span> آنلاین — آماده پاسخ</p>
        </div>
      </div>
      <button class="icon-btn" onclick="openAdmin()" title="پنل ادمین">⚙️</button>
    </header>

    <!-- CHAT -->
    <div class="chat" id="chatBody"></div>
    <div class="quick" id="quickReplies"></div>

    <!-- FOOTER -->
    <div class="footer">
      <input type="text" id="userInput" placeholder="سوالتون رو بنویسید..." autocomplete="off">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin" id="adminPanel">
      <div class="admin-head">
        <h2>⚙️ پنل مدیریت</h2>
        <button class="close-btn" onclick="closeAdmin()">✕</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="dash" onclick="switchTab('dash')">📊 داشبورد</button>
        <button class="tab" data-tab="kb" onclick="switchTab('kb')">🧠 دانشنامه</button>
        <button class="tab" data-tab="tickets" onclick="switchTab('tickets')">📨 درخواست‌ها</button>
        <button class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ تنظیمات</button>
      </div>

      <div class="admin-body">
        
        <!-- DASHBOARD -->
        <div class="pane active" data-pane="dash">
          <div class="section">
            <h3>📊 آمار کلی</h3>
          </div>
          <div class="stats">
            <div class="stat"><div class="num" id="statKB">0</div><div class="lbl">پاسخ دانشنامه</div></div>
            <div class="stat"><div class="num" id="statTickets">0</div><div class="lbl">درخواست پشتیبانی</div></div>
            <div class="stat"><div class="num" id="statMessages">0</div><div class="lbl">پیام چت</div></div>
          </div>
          <div class="section">
            <h3>⚡ عملیات سریع</h3>
          </div>
          <button class="btn btn-primary" onclick="openKnowledgeModal()">➕ افزودن پاسخ جدید</button>
        </div>

        <!-- KNOWLEDGE -->
        <div class="pane" data-pane="kb">
          <div class="section">
            <h3>🧠 مدیریت دانشنامه</h3>
            <button class="btn btn-primary btn-sm" onclick="openKnowledgeModal()">➕ افزودن</button>
          </div>
          <div id="kbList"></div>
        </div>

        <!-- TICKETS -->
        <div class="pane" data-pane="tickets">
          <div class="section">
            <h3>📨 درخواست‌های پشتیبانی انسانی</h3>
            <button class="btn btn-danger btn-sm" onclick="clearTickets()">🗑 پاک کردن</button>
          </div>
          <div id="ticketsList"></div>
        </div>

        <!-- SETTINGS -->
        <div class="pane" data-pane="settings">
          <div class="section">
            <h3>⚙️ تنظیمات ربات</h3>
          </div>
          <div class="form-group">
            <label>نام دستیار</label>
            <input type="text" id="setBotName">
          </div>
          <div class="form-group">
            <label>پیام خوش‌آمد</label>
            <textarea id="setWelcome" style="min-height:100px;"></textarea>
          </div>
          <div class="form-group">
            <label>سرعت پاسخ (میلی‌ثانیه)</label>
            <input type="number" id="setSpeed" min="200" max="3000" step="100">
          </div>
          <div class="form-group">
            <label>لینک Google Apps Script (برای ارسال به تلگرام)</label>
            <input type="text" id="setWebhook" placeholder="https://script.google.com/macros/s/.../exec" style="direction:ltr;font-size:11px;">
          </div>
          <button class="btn btn-primary" onclick="saveSettings()">💾 ذخیره تنظیمات</button>

<script>
/* ================= CONFIG ================= */
const DEFAULT_PASSWORD = 'shirzad1404';
const STORAGE_KEY = 'saffron_chat_v7';

const DEFAULT_KB = [
  { id:'k1', keywords:['زعفران چیه','زعفران چیست'], answer:'🌿 <strong>زعفران چیه؟</strong><br><br>گران‌بهاترین ادویه دنیاست که از کلاله گل <strong>Crocus sativus</strong> به دست میاد.<br><br>• هر گل فقط <strong>۳ کلاله</strong> داره<br>• برای ۱ کیلو، حدود <strong>۱۵۰,۰۰۰ گل</strong> لازمه<br>• برداشتش کاملاً دستیه<br>🇮🇷 ایران <strong>۹۰٪ زعفران جهان</strong> رو تأمین می‌کنه.' },
  { id:'k2', keywords:['انواع زعفران','سرگل','پوشال','نگین','دسته'], answer:'📦 <strong>انواع زعفران:</strong><br><br>🥇 <strong>سرگل/نگین:</strong> فقط کلاله سرخ — باکیفیت‌ترین<br>🌿 <strong>پوشال:</strong> کلاله + کمی خامه زرد<br>📦 <strong>دسته:</strong> کلاله با خامه، دسته‌ای<br>🥄 <strong>سائیده:</strong> پودری' },
  { id:'k3', keywords:['تشخیص اصالت','زعفران اصل','تقلب'], answer:'✨ <strong>تشخیص زعفران اصل:</strong><br><br>1️⃣ در آب سرد، رنگ زرد طلایی آروم آزاد می‌کنه<br>2️⃣ عطر طبیعی مخصوص داره<br>3️⃣ بین انگشتا نرم و روغنیه<br>4️⃣ کلاله‌ها طبیعی و قلمی‌ان<br><br>🔬 بهترین راه: آزمون آزمایشگاهی.' },
  { id:'k4', keywords:['خواص زعفران','خاصیت','فایده'], answer:'💚 <strong>خواص زعفران:</strong><br><br>• <strong>ضد افسردگی</strong> طبیعی<br>• <strong>آنتی‌اکسیدان قوی</strong><br>• <strong>تقویت حافظه و تمرکز</strong><br>• <strong>بهبود خلق‌وخو</strong><br>• <strong>سلامت قلب</strong><br><br>⚠️ روزانه ۳۰-۵۰ میلی‌گرم کافیه.' },
  { id:'k5', keywords:['دم کردن','روش استفاده','طریقه'], answer:'🍵 <strong>روش صحیح استفاده:</strong><br><br>1️⃣ مقدار لازم رو با کمی شکر آسیاب کن<br>2️⃣ آب جوش (نه در حال جوش) اضافه کن<br>3️⃣ در ظرف دربسته <strong>۲۰ دقیقه</strong> دم کن<br>4️⃣ عصاره طلایی آماده‌ست!' },
  { id:'k6', keywords:['نگهداری','انبار'], answer:'🏺 <strong>نگهداری صحیح:</strong><br><br>• ظرف <strong>شیشه‌ای تیره</strong><br>• دور از نور مستقیم<br>• محل خشک و خنک<br>• درب کاملاً بسته<br>• <strong>۶ ماه</strong> پس از باز کردن مصرف کن' },
  { id:'k7', keywords:['سفارش','خرید','قیمت'], answer:'💰 <strong>سفارش و قیمت:</strong><br><br>برای اطلاع از قیمت روز و ثبت سفارش:<br>📞 با پشتیبانی تماس بگیرید<br>💬 یا بنویسید «پشتیبان» تا با شما تماس بگیریم' },
  { id:'k8', keywords:['سلام','درود','وقت بخیر'], answer:'سلام و درود! 🌸<br>چطور میتونم کمکتون کنم؟' },
  { id:'k9', keywords:['ممنون','مرسی','سپاس'], answer:'خواهش می‌کنم 🌸<br>هر وقت سوالی داشتید در خدمتم!' },
  { id:'k10', keywords:['خداحافظ','بای'], answer:'خدانگهدار! 🌸<br>منتظر حضور گرمتون هستیم ✨' },
  { id:'k11', keywords:['پشتیبان','انسان','اپراتور','مشاور','مسئول','تماس'], answer:'__TRIGGER_SUPPORT__' }
];

const DEFAULT_QUICK = [
  { id:'q1', label:'🌿 زعفران چیه؟', query:'زعفران چیه؟' },
  { id:'q2', label:'💚 خواص زعفران', query:'خواص زعفران چیه؟' },
  { id:'q3', label:'✨ تشخیص اصالت', query:'چطور زعفران اصل رو تشخیص بدم؟' },
  { id:'q4', label:'💬 تماس با پشتیبان', query:'می‌خوام با پشتیبان صحبت کنم' }
];

/* ================= STATE ================= */
let state = {
  kb: [],
  quick: [],
  tickets: [],
  messages: [],
  passwordHash: '',
  settings: {
    botName: 'دستیار زعفران شیرزاد',
    welcome: 'سلام و درود! 🌸<br>به پشتیبانی <strong>زعفران شیرزاد</strong> خوش آمدید.<br><br>من اینجام تا درباره زعفران، خواص، روش استفاده و کیفیت کمکتون کنم.<br><br>💬 اگه خواستید با پشتیبان انسانی صحبت کنید، بنویسید «پشتیبان».',
    speed: 800,
    webhook: ''
  }
};

/* ================= UTILS ================= */
function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h = h & h;
  }
  return 'h_' + Math.abs(h).toString(36) + '_' + s.length;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function now() {
  return new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}

/* ================= STORAGE ================= */
function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p.kb) state.kb = p.kb;
      if (p.quick) state.quick = p.quick;
      if (p.tickets) state.tickets = p.tickets;
      if (p.passwordHash) state.passwordHash = p.passwordHash;
      if (p.settings) state.settings = { ...state.settings, ...p.settings };
    } else {
      resetDefaults();
    }
    if (!state.kb.length) state.kb = JSON.parse(JSON.stringify(DEFAULT_KB));
    if (!state.quick.length) state.quick = JSON.parse(JSON.stringify(DEFAULT_QUICK));
    if (!state.passwordHash) state.passwordHash = hash(DEFAULT_PASSWORD);
  } catch (e) {
    console.error(e);
    resetDefaults();
  }
}

function resetDefaults() {
  state.kb = JSON.parse(JSON.stringify(DEFAULT_KB));
  state.quick = JSON.parse(JSON.stringify(DEFAULT_QUICK));
  state.tickets = [];
  state.messages = [];
  state.passwordHash = hash(DEFAULT_PASSWORD);
  state.settings = {
    botName: 'دستیار زعفران شیرزاد',
    welcome: 'سلام و درود! 🌸<br>به پشتیبانی <strong>زعفران شیرزاد</strong> خوش آمدید.<br><br>من اینجام تا درباره زعفران، خواص، روش استفاده و کیفیت کمکتون کنم.<br><br>💬 اگه خواستید با پشتیبان انسانی صحبت کنید، بنویسید «پشتیبان».',
    speed: 800,
    webhook: ''
  };
  save();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      kb: state.kb,
      quick: state.quick,
      tickets: state.tickets,
      passwordHash: state.passwordHash,
      settings: state.settings
    }));
  } catch (e) { console.error(e); }
}

/* ================= CHAT ================= */
const chatBody = document.getElementById('chatBody');
const userInput = document.getElementById('userInput');

function addMsg(text, sender, save = true) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (sender === 'user' ? ' user' : '');
  const av = document.createElement('div');
  av.className = 'msg-av ' + sender;
  av.textContent = sender === 'user' ? '👤' : '🌸';
  const msg = document.createElement('div');
  msg.className = 'msg ' + sender;
  msg.innerHTML = text + '<time>' + now() + '</time>';
  row.appendChild(av); row.appendChild(msg);
  chatBody.appendChild(row);
  chatBody.scrollTop = chatBody.scrollHeight;
  if (save) state.messages.push({ text, sender });
}

function showTyping() {
  const t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<div class="msg-av bot">🌸</div><div class="typing-bubble"><span></span><span></span><span></span></div>';
  chatBody.appendChild(t);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function findAnswer(text) {
  const t = text.toLowerCase();
  let best = null, score = 0;
  for (const item of state.kb) {
    let s = 0;
    for (const kw of item.keywords) {
      if (t.includes(kw.toLowerCase())) s += kw.length;
    }
    if (s > score) { score = s; best = item; }
  }
  return best;
}

function sendMessage(text) {
  const val = (text || userInput.value).trim();
  if (!val) return;
  addMsg(esc(val), 'user', false);
  userInput.value = '';

  const ans = findAnswer(val);
  
  if (ans && ans.answer === '__TRIGGER_SUPPORT__') {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMsg('💬 <strong>درخواست چت با پشتیبان انسانی</strong><br><br>لطفاً اطلاعات زیر رو پر کنید تا کارشناس ما در اسرع وقت با شما تماس بگیره:', 'bot');
      setTimeout(showSupportForm, 300);
    }, 600);
    return;
  }

  showTyping();
  setTimeout(() => {
    hideTyping();
    if (ans) {
      addMsg(ans.answer, 'bot');
    } else {
      const fallback = [
        'متوجه شدم 🌸 می‌تونید سوالتون رو دقیق‌تر بپرسید؟',
        'سوال جالبیه! 🌿 برای پاسخ دقیق‌تر، موضوع رو مشخص‌تر بگید.',
        'درباره این موضوع اطلاعات دقیقی ندارم 🌸<br>💬 برای صحبت با پشتیبان بنویسید «پشتیبان».',
        'سوالتون رو دریافت کردم ✨ درباره <strong>زعفران، خواص یا کیفیت</strong> بپرسید.'
      ];
      addMsg(fallback[Math.floor(Math.random() * fallback.length)], 'bot');
    }
  }, state.settings.speed + Math.random() * 400);
}

/* ================= SUPPORT FORM ================= */
function showSupportForm() {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-av bot">🌸</div>
    <div class="msg bot" style="max-width:90%;">
      <div class="support-form">
        <h4>📝 فرم درخواست تماس</h4>
        <input type="text" id="sfName" placeholder="نام و نام خانوادگی *">
        <input type="tel" id="sfPhone" placeholder="شماره تماس *" style="direction:ltr;">
        <textarea id="sfMsg" placeholder="موضوع یا سوال شما..."></textarea>
        <button id="sfSend" onclick="submitSupport()">📨 ارسال درخواست</button>
      </div>
    </div>
  `;
  chatBody.appendChild(row);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function submitSupport() {
  const name = document.getElementById('sfName').value.trim();
  const phone = document.getElementById('sfPhone').value.trim();
  const msg = document.getElementById('sfMsg').value.trim();
  const btn = document.getElementById('sfSend');

  if (!name || !phone) {
    toast('⚠️ نام و شماره الزامی است');
    return;
  }

  const ticket = {
    id: 'T' + Date.now().toString().slice(-8),
    name, phone, message: msg || '(بدون پیام)',
    createdAt: Date.now()
  };

  state.tickets.unshift(ticket);
  save();

  btn.disabled = true;
  btn.textContent = '⏳ در حال ارسال...';

  // ارسال به Google Apps Script
  const webhook = state.settings.webhook;
  if (webhook) {
    fetch(webhook, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, message: msg || '(بدون پیام)' })
    })
    .then(() => {
      addMsg('✅ <strong>درخواست شما ثبت شد!</strong><br><br>👤 ' + esc(name) + '<br>📞 ' + esc(phone) + '<br><br>کارشناس ما در اسرع وقت با شما تماس می‌گیره 🌸', 'bot');
      toast('✅ درخواست ارسال شد');
    })
    .catch(() => {
      addMsg('✅ <strong>درخواست شما ثبت شد!</strong><br><br>👤 ' + esc(name) + '<br>📞 ' + esc(phone) + '<br><br>به‌زودی با شما تماس می‌گیریم 🌸', 'bot');
      toast('✅ ثبت شد');
    });
  } else {
    addMsg('✅ <strong>درخواست شما ثبت شد!</strong><br><br>👤 ' + esc(name) + '<br>📞 ' + esc(phone) + '<br><br>کارشناس ما به‌زودی با شما تماس می‌گیره 🌸', 'bot');
    toast('✅ ثبت شد');
  }

  // حذف فرم
  setTimeout(() => {
    const forms = document.querySelectorAll('.support-form');
    if (forms.length) forms[forms.length - 1].closest('.msg-row').remove();
  }, 500);
}

/* ================= QUICK REPLIES ================= */
function renderQuick() {
  const box = document.getElementById('quickReplies');
  box.innerHTML = '';
  state.quick.forEach(q => {
    const b = document.createElement('button');
    b.textContent = q.label;
    b.onclick = () => sendMessage(q.query);
    box.appendChild(b);
  });
}

/* ================= ADMIN ================= */
let isLoggedIn = false;

function openAdmin() {
  if (isLoggedIn) {
    document.getElementById('adminPanel').classList.add('open');
    refreshAdmin();
  } else {
    document.getElementById('loginPanel').classList.add('open');
    setTimeout(() => document.getElementById('loginPass').focus(), 100);
  }
}

function closeAdmin() {
  document.getElementById('adminPanel').classList.remove('open');
}

function closeLogin() {
  document.getElementById('loginPanel').classList.remove('open');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').textContent = '';
}

function tryLogin() {
  const p = document.getElementById('loginPass').value;
  if (!p) return;
  if (hash(p) === state.passwordHash) {
    isLoggedIn = true;
    closeLogin();
    document.getElementById('adminPanel').classList.add('open');
    refreshAdmin();
    toast('✅ خوش آمدید');
  } else {
    document.getElementById('loginErr').textContent = '❌ رمز اشتباه است';
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.pane === name));
  refreshAdmin();
}

function refreshAdmin() {
  document.getElementById('statKB').textContent = state.kb.length;
  document.getElementById('statTickets').textContent = state.tickets.length;
  document.getElementById('statMessages').textContent = state.messages.length;

  renderKBList();
  renderTickets();
  fillSettings();
}

function renderKBList() {
  const box = document.getElementById('kbList');
  if (!state.kb.length) {
    box.innerHTML = '<div class="empty"><span class="em">🧠</span>هنوز پاسخی ثبت نشده</div>';
    return;
  }
  box.innerHTML = state.kb.map(k => `
    <div class="item">
      <div class="item-head">
        <div class="keywords">
          ${k.keywords.map(kw => `<span class="kw">${esc(kw)}</span>`).join('')}
        </div>
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" onclick="editKB('${k.id}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteKB('${k.id}')">🗑</button>
        </div>
      </div>
      <div class="answer">${(k.answer === '__TRIGGER_SUPPORT__' ? '💬 [نمایش فرم پشتیبانی]' : k.answer).replace(/<[^>]+>/g, '').substring(0, 120)}</div>
    </div>
  `).join('');
}

function editKB(id) {
  const k = state.kb.find(x => x.id === id);
  if (!k) return;
  openKBModal(k);
}

function deleteKB(id) {
  if (!confirm('این پاسخ حذف شود؟')) return;
  state.kb = state.kb.filter(x => x.id !== id);
  save();
  refreshAdmin();
  toast('🗑 حذف شد');
}

function openKnowledgeModal() {
  openKBModal(null);
}

function openKBModal(item) {
  const isEdit = !!item;
  const kws = item ? item.keywords.join('\n') : '';
  const ans = item ? item.answer : '';
  openModal(isEdit ? '✏️ ویرایش پاسخ' : '➕ افزودن پاسخ', `
    <div class="form-group">
      <label>کلمات کلیدی (هر خط یک کلمه)</label>
      <textarea id="mKw" style="min-height:90px;" placeholder="زعفران چیه&#10;زعفران چیست">${esc(kws)}</textarea>
    </div>
    <div class="form-group">
      <label>پاسخ (می‌توانید HTML استفاده کنید)</label>
      <textarea id="mAns" style="min-height:120px;" placeholder="پاسخ خود را اینجا بنویسید...">${esc(ans === '__TRIGGER_SUPPORT__' ? '' : ans)}</textarea>
    </div>
    <div style="font-size:11.5px; color:var(--muted); padding:8px; background:rgba(34,197,94,0.08); border-radius:8px; border:1px solid rgba(34,197,94,0.3);">
      💡 برای نمایش فرم پشتیبانی، در فیلد پاسخ بنویسید: <code style="color:var(--green);">__TRIGGER_SUPPORT__</code>
    </div>
  `, () => {
    const kwsRaw = document.getElementById('mKw').value.trim();
    const ansRaw = document.getElementById('mAns').value.trim();
    if (!kwsRaw || !ansRaw) {
      toast('⚠️ کلمات کلیدی و پاسخ الزامی است');
      return false;
    }
    const keywords = kwsRaw.split('\n').map(s => s.trim()).filter(Boolean);
    if (isEdit) {
      item.keywords = keywords;
      item.answer = ansRaw;
    } else {
      state.kb.push({ id: 'k' + Date.now(), keywords, answer: ansRaw });
    }
    save();
    refreshAdmin();
    toast('✅ ذخیره شد');
  });
}

function renderTickets() {
  const box = document.getElementById('ticketsList');
  if (!state.tickets.length) {
    box.innerHTML = '<div class="empty"><span class="em">📨</span>هنوز درخواستی ثبت نشده</div>';
    return;
  }
  box.innerHTML = state.tickets.map(t => {
    const date = new Date(t.createdAt).toLocaleString('fa-IR');
    return `
      <div class="item">
        <div class="item-head">
          <div>
            <div style="font-size:13px; font-weight:700; color:var(--text);">👤 ${esc(t.name)}</div>
            <div style="font-size:11px; color:var(--muted); margin-top:3px;">🕐 ${date}</div>
          </div>
          <div class="item-actions">
            <button class="btn btn-danger btn-sm" onclick="deleteTicket('${t.id}')">🗑</button>
          </div>
        </div>
        <div style="font-size:12.5px; color:var(--text); margin-top:8px; line-height:1.8;">
          📞 <strong style="direction:ltr; display:inline-block;">${esc(t.phone)}</strong><br>
          💬 ${esc(t.message)}
        </div>
      </div>
    `;
  }).join('');
}

function deleteTicket(id) {
  if (!confirm('حذف شود؟')) return;
  state.tickets = state.tickets.filter(t => t.id !== id);
  save();
  refreshAdmin();
  toast('🗑 حذف شد');
}

function clearTickets() {
  if (!state.tickets.length) return;
  if (!confirm('همه درخواست‌ها پاک شوند؟')) return;
  state.tickets = [];
  save();
  refreshAdmin();
  toast('🗑 پاک شد');
}

function fillSettings() {
  document.getElementById('setBotName').value = state.settings.botName;
  document.getElementById('setWelcome').value = state.settings.welcome.replace(/<br>/g, '\n').replace(/<[^>]+>/g, '');
  document.getElementById('setSpeed').value = state.settings.speed;
  document.getElementById('setWebhook').value = state.settings.webhook || '';
}

function saveSettings() {
  state.settings.botName = document.getElementById('setBotName').value.trim() || 'دستیار';
  state.settings.welcome = document.getElementById('setWelcome').value.trim().replace(/\n/g, '<br>');
  const sp = parseInt(document.getElementById('setSpeed').value);
  state.settings.speed = (isNaN(sp) || sp < 200) ? 800 : Math.min(sp, 3000);
  state.settings.webhook = document.getElementById('setWebhook').value.trim();
  save();
  toast('✅ تنظیمات ذخیره شد');
}

function changePassword() {
  const oldP = document.getElementById('oldPass').value;
  const newP = document.getElementById('newPass').value;
  if (hash(oldP) !== state.passwordHash) { toast('❌ رمز فعلی اشتباهه'); return; }
  if (newP.length < 6) { toast('⚠️ حداقل ۶ کاراکتر'); return; }
  state.passwordHash = hash(newP);
  save();
  document.getElementById('oldPass').value = '';
  document.getElementById('newPass').value = '';
  toast('✅ رمز تغییر کرد');
}

/* ================= MODAL ================= */
function openModal(title, body, onSave) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalSave').onclick = () => {
    if (onSave() !== false) closeModal();
  };
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

/* ================= BACKUP ================= */
function exportBackup() {
  const data = {
    kb: state.kb,
    quick: state.quick,
    tickets: state.tickets,
    settings: state.settings,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'saffron-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('📥 دانلود شد');
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm('داده‌های فعلی جایگزین می‌شوند. مطمئنید؟')) return;
      if (data.kb) state.kb = data.kb;
      if (data.quick) state.quick = data.quick;
      if (data.tickets) state.tickets = data.tickets;
      if (data.settings) state.settings = { ...state.settings, ...data.settings };
      save();
      renderQuick();
      refreshAdmin();
      toast('✅ بازیابی شد');
    } catch (err) {
      toast('❌ فایل نامعتبر');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ================= INIT ================= */
load();
renderQuick();
addMsg(state.settings.welcome, 'bot', false);

// Focus input on load
window.addEventListener('load', () => {
  setTimeout(() => userInput.focus(), 100);
});

userInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
